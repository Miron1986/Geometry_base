body{font:17px/1.45 system-ui;max-width:720px;margin:20px auto;padding:0 14px;color:#182b40}h1{font-size:26px;margin:.3em 0}h2{font-size:20px;margin:.8em 0 .2em}button{font:inherit;padding:8px 12px;margin:3px;border:1px solid #879bb1;border-radius:8px;background:white;color:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}button[aria-pressed=true]{background:#dceaff;border-color:#2f62a8}#nav button{min-width:40px;padding:6px 8px}#nav button.done{background:#e3f4e6;border-color:#4f9a5c}#nav button.done[aria-pressed=true]{background:#c9ebd0;border-width:2px}button:focus-visible{outline:3px solid #276ac1}svg{width:100%;max-height:360px;background:#f1f5fa;border-radius:12px}svg text{font:17px system-ui;fill:#182b40;pointer-events:none}.hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer;outline:none!important;-webkit-tap-highlight-color:transparent}.hit.side{stroke-width:10}.hit:hover,.hit:focus-visible{stroke:#477dc875}.mark{stroke:#164fa4;stroke-width:3;fill:none;pointer-events:none}.right{stroke:#164fa4;fill:#f1f5fa;stroke-width:1.5;pointer-events:none}small{color:#46586d}#msg{min-height:3em}
</style><h1>Доказательства: признаки равенства</h1><nav id="nav" aria-label="Задания"></nav><small id="progress"></small><h2 id="sec"></h2><p id="task"></p><p><small id="help"></small></p><svg id="pic" viewBox="0 0 400 252" role="img"></svg><p><button id="check">Проверить</button><button id="clear">Сбросить</button><button id="prev">Назад</button><button id="next">Дальше</button></p><p id="msg" aria-live="polite"></p><script>
const $=id=>document.getElementById(id);
const nS=s=>[...s].sort().join(''), nA=s=>{let e=[s[0],s[2]].sort();return e[0]+s[1]+e[1]};
const F={
kite:{p:{A:[40,125],B:[200,35],D:[200,215],C:[360,125]},s:['AB','BC','CD','DA','AC']},
cross:{p:{A:[60,50],B:[60,200],C:[340,200],D:[340,50],O:[200,125]},s:['AO','OC','BO','OD','AB','CD'],lab:{O:[0,-17]}},
isoDE:{p:{A:[200,30],B:[50,215],C:[350,215],D:[132.5,113],E:[267.5,113]},s:['BD','DA','CE','EA','BC','DC','BE']},
perp:{p:{A:[260,30],D:[260,125],C:[260,220],B:[60,125]},s:['AB','BC','AD','DC','BD']},

fan:{p:{A:[200,30],B:[26.8,130],C:[373.2,130],D:[145,147.8],E:[255,147.8]},s:['AB','AC','AD','AE','BD','CE']},
isoM:{p:{A:[200,35],B:[45,210],M:[200,210],C:[355,210]},s:['AB','AC','AM','BM','MC']},

const T=[
{fig:'kite',max:2,rv:[],hs:['AB','AD','BC','CD'],ha:['BAC','CAD','ACB','ACD','ABC','ADC'],allow:{s:[],a:[['BAC','CAD'],['ACB','ACD']]},forbid:{s:[['AB','AD'],['BC','CD']],a:[['ABC','ADC']]},text:'AC — биссектриса углов BAD и BCD. Докажи, что треугольники ABC и ADC равны по второму признаку. Отметь нужные равенства. Общая сторона AC отметки не требует.',help2:'Разные пары равных углов отмечай разным числом дуг.',exp:{a:[['BAC','CAD'],['ACB','ACD']]},hint:'Нужны две пары равных углов при концах общей стороны AC. Их даёт биссектриса. Разные пары отмечай разным числом дуг.',ok:'Верно: ∠BAC = ∠CAD, ∠BCA = ∠DCA и сторона AC общая. Значит, треугольники ABC и ADC равны по второму признаку.'},
{fig:'cross',max:2,rv:[],ar:26,hs:['AO','OC','BO','OD','AB','CD'],ha:['AOB','BOC','COD','AOD','BAO','DCO','ABO','CDO'],allow:{s:[['AO','CO'],['BO','DO']],a:[['AOB','COD'],['BOC','AOD']]},forbid:{s:[['AB','CD']],a:[['BAO','DCO'],['ABO','CDO']]},text:'Отрезки AC и BD пересекаются в точке O, которая является серединой каждого из них. Докажи, что треугольники AOB и COD равны. Отметь нужные равенства.',help2:'Две пары равных отрезков отмечай разными засечками.',exp:{s:[['AO','CO'],['BO','DO']],a:[['AOB','COD']]},hint:'Каждую пару равных отрезков даёт середина. Угол между ними при вершине O нужно выбрать на пересечении двух прямых.',ok:'Верно: AO = OC и BO = OD, так как O — середина обоих отрезков, а ∠AOB = ∠COD как вертикальные. Значит, треугольники равны по первому признаку.'},
{fig:'isoDE',max:2,rv:[],hs:['BD','CE','DA','EA'],ha:['DBC','ECB','BDC','CEB'],allow:{s:[['BD','CE'],['AD','AE']],a:[['DBC','ECB']]},forbid:{a:[['BDC','CEB']]},text:'В треугольнике ABC AB = AC, точка D лежит на AB, точка E на AC, BD = CE. Докажи, что треугольники DBC и ECB равны. Отметь нужные равенства. Общая сторона BC отметки не требует.',exp:{s:[['BD','CE']],a:[['DBC','ECB']]},hint:'Одна пара равных сторон дана. Для другого нужного равенства используй свойство углов при основании равнобедренного треугольника.',ok:'Верно: BD = CE, BC общая и ∠DBC = ∠ECB, так как это углы при основании равнобедренного треугольника. Значит, треугольники равны по первому признаку.'},
{fig:'perp',max:1,rv:['D'],hs:['AD','CD','AB','BC'],ha:['ADB','BDC','BAD','BCD'],allow:{s:[['AD','CD']],a:[]},forbid:{s:[['AB','BC']],a:[['BAD','BCD']]},text:'BD ⟂ AC и AD = DC. Докажи, что треугольники ABD и CBD равны. Отметь нужные равенства. Прямые углы отмечай с обеих сторон от BD.',exp:{s:[['AD','CD']],r:['ADB','BDC'],rAll:1},hint:'Нужны равные стороны при вершине D, равные углы между ними и общей стороной BD. Углы при D равны, потому что оба прямые.',ok:'Верно: AD = DC, BD общая и ∠ADB = ∠BDC = 90°. Значит, треугольники равны по первому признаку.'},
{fig:'bisD',max:2,rv:[],hs:['AB','BC','AD','CD'],ha:['ABD','CBD','BAD','BCD','ADB','BDC'],allow:{s:[['AB','BC']],a:[['ABD','CBD'],['BAD','BCD']]},forbid:{s:[['AD','CD']],a:[['ADB','BDC']]},text:'AB = BC, BD — биссектриса угла B. Докажи, что AD = DC: для этого покажи, что треугольники ABD и CBD равны. Отметь нужные равенства. Сам вывод AD = DC не отмечай.',exp:{s:[['AB','BC']],a:[['ABD','CBD']]},hint:'Нужны две равные стороны при вершине B и равные углы между ними и общей стороной BD. Эти углы даёт биссектриса.',ok:'Верно: AB = BC, BD общая и ∠ABD = ∠CBD. Значит, треугольники ABD и CBD равны по первому признаку, откуда AD = DC и BD — ещё и медиана.'},
{fig:'asa',max:2,rv:[],ar:26,hs:['AO','BO','AC','BD','CO','DO'],ha:['CAO','DBO','AOC','BOD','AOD','BOC','ACO','BDO'],allow:{s:[['AO','BO']],a:[['CAO','DBO'],['AOC','BOD'],['AOD','BOC']]},forbid:{s:[['AC','BD'],['CO','DO']],a:[['ACO','BDO']]},text:'O — середина отрезка AB, отрезки AB и CD пересекаются в точке O, ∠CAO = ∠DBO. Докажи, что треугольники AOC и BOD равны по второму признаку. Отметь нужные равенства.',help2:'Разные пары равных углов отмечай разным числом дуг.',exp:{s:[['AO','BO']],a:[['CAO','DBO'],['AOC','BOD']]},hint:'Нужна сторона между двумя парами равных углов. Одну пару углов даёт условие, другую — вертикальные углы при O. Эти пары отмечай разным числом дуг.',ok:'Верно: AO = OB, ∠CAO = ∠DBO и ∠AOC = ∠BOD как вертикальные. Значит, треугольники AOC и BOD равны по второму признаку.'},
{fig:'fan',max:2,rv:[],hs:['AB','AC','AD','AE','BD','CE'],ha:['BAD','CAE','DAE','ABD','ACE','ADB','AEC'],allow:{s:[['AB','AC'],['AD','AE']],a:[['BAD','CAE']]},forbid:{s:[['BD','CE']],a:[['ABD','ACE'],['ADB','AEC']]},text:'AB = AC, AD = AE и ∠BAD = ∠CAE. Докажи, что BD = CE: для этого покажи, что треугольники ABD и ACE равны. Отметь нужные равенства. Сам вывод BD = CE не отмечай.',help2:'Две пары равных сторон отмечай разными засечками.',exp:{s:[['AB','AC'],['AD','AE']],a:[['BAD','CAE']]},hint:'Нужны две пары сторон, которые выходят из вершины A, и равные углы между ними. Ищи углы, образованные этими сторонами.',ok:'Верно: AB = AC, AD = AE и ∠BAD = ∠CAE. Значит, треугольники ABD и ACE равны по первому признаку, откуда BD = CE.'},
{fig:'isoM',max:2,rv:[],hs:['AB','AC','BM','MC'],ha:['ABM','ACM','BAM','CAM','AMB','AMC'],allow:{s:[['AB','AC'],['BM','CM']],a:[]},forbid:{a:[['ABM','ACM'],['BAM','CAM'],['AMB','AMC']]},text:'AB = AC, AM — медиана к основанию BC. Докажи, что треугольники ABM и ACM равны по третьему признаку. Отметь нужные равенства. Общая сторона AM отметки не требует.',help2:'Две пары равных сторон отмечай разными засечками.',exp:{s:[['AB','AC'],['BM','CM']]},hint:'Третий признак требует три пары равных сторон. Две пары нужно отметить, а третья сторона общая.',ok:'Верно: AB = AC, BM = MC (AM — медиана), AM общая. Значит, треугольники ABM и ACM равны по третьему признаку, поэтому ∠BAM = ∠CAM и ∠AMB = ∠AMC.'},
{fig:'quad',max:2,rv:[],hs:['AB','CD','BC','AD'],ha:['ABC','ADC','BAC','ACD','ACB','CAD'],allow:{s:[['AB','CD'],['BC','AD']],a:[]},forbid:{a:[['ABC','ADC'],['BAC','ACD'],['ACB','CAD']]},text:'В четырёхугольнике ABCD AB = CD и BC = AD. Докажи, что треугольники ABC и CDA равны по третьему признаку. Отметь нужные равенства. Общая сторона AC отметки не требует.',help2:'Две пары равных сторон отмечай разными засечками.',exp:{s:[['AB','CD'],['BC','AD']]},hint:'Нужны три пары равных сторон. Две пары даны, а третья сторона AC общая. Углы отмечать не нужно.',ok:'Верно: AB = CD, BC = AD и AC общая. Значит, треугольники ABC и CDA равны по третьему признаку.'}];
T.forEach(x=>x.sec='Доказательство');
let cur=0,lv={},done=new Set();try{done=new Set(JSON.parse(localStorage.getItem('geomProofs2')||'[]'))}catch(e){}
const U=(a,b)=>{let x=b[0]-a[0],y=b[1]-a[1],d=Math.hypot(x,y);return[x/d,y/d]},add=(a,u,t)=>[a[0]+u[0]*t,a[1]+u[1]*t],pt=a=>a.map(v=>+v.toFixed(2)).join(' '),sg=(a,b)=>`M${pt(a)} L${pt(b)}`,pa=(d,c)=>`<path d="${d}" ${c}/>`;
let P,t;
const isR=id=>t.rv==='*'||(t.rv||[]).includes(id[1]);
function vec(id){let a=P[id[1]];return[a,U(a,P[id[0]]),U(a,P[id[2]])]}
function arc(id,r){let[a,u,v]=vec(id);return`M${pt(add(a,u,r))} A${r} ${r} 0 0 ${+(u[0]*v[1]-u[1]*v[0]>0)} ${pt(add(a,v,r))}`}
function ticks(id,n){let a=P[id[0]],b=P[id[1]],u=U(a,b),m=[(a[0]+b[0])/2,(a[1]+b[1])/2],v=[-u[1],u[0]],o='';for(let j=0;j<n;j++){let q=add(m,u,(j-(n-1)/2)*7);o+=pa(sg(add(q,v,-7),add(q,v,7)),'class="mark"')}return o}
function arcs(id,n){let o='',r=(t.ar||30);for(let j=0;j<n;j++)o+=pa(arc(id,r-4+j*5),'class="mark"');return o}
function sq(id){let[a,u,v]=vec(id);if(Math.abs(u[0]*v[0]+u[1]*v[1])<1e-6){let x=add(a,u,15);return pa(`${sg(x,add(x,v,15))} L${pt(add(a,v,15))}`,'class="mark"')}let z=[u[0]+v[0],u[1]+v[1]],d=Math.hypot(...z),q=add(a,z,23/d);return`<rect x="${q[0]-4}" y="${q[1]-4}" width="8" height="8" class="right"/>`}
function draw(focus){let o='';
for(let s of F[t.fig].s)o+=pa(sg(P[s[0]],P[s[1]]),'stroke="#24384d" stroke-width="2" fill="none"');
let keys=Object.keys(P),lab=F[t.fig].lab||{};
for(let k of keys){let q;if(lab[k])q=[P[k][0]+lab[k][0],P[k][1]+lab[k][1]];else{let c=[keys.reduce((s,x)=>s+P[x][0],0)/keys.length,keys.reduce((s,x)=>s+P[x][1],0)/keys.length];q=add(P[k],U(c,P[k]),17)}o+=`<text x="${q[0]}" y="${q[1]+5}" text-anchor="middle">${k}</text>`}
for(let[id,n]of Object.entries(lv)){if(!n)continue;o+=id.length===2?ticks(id,n):isR(id)?sq(id):arcs(id,n)}
for(let s of t.hs)o+=hit(nS(s),sg(P[s[0]],P[s[1]]),'Отрезок '+s,1);
for(let a of t.ha)o+=hit(nA(a),arc(a,(t.ar||30)+4),'Угол '+a,0);
$('pic').innerHTML=o;$('pic').setAttribute('aria-label','Чертёж, задание '+(cur+1));
for(let el of $('pic').querySelectorAll('[data-k]')){let k=el.dataset.k,run=kb=>{let m=(k.length===3&&isR(k))?1:t.max;lv[k]=((lv[k]||0)+1)%(m+1);$('msg').textContent='';draw(kb?k:null)};el.onclick=()=>run(0);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();run(1)}};if(k===focus)el.focus()}}
function hit(k,d,l,side){return pa(d,`class="hit ${side?'side':''}" data-k="${k}" tabindex="0" role="button" aria-label="${l}, ${['нет отметки','отмечено','отмечено дважды'][lv[k]||0]}"`)}
const sub=(a,b)=>a.every(x=>b.includes(x));
function groups(l){let m={};l.forEach(([id,n])=>(m[n]=m[n]||[]).push(id));return Object.values(m).map(g=>g.sort())}
function kind(k,nf,st){let req=(t.exp[k]||[]).map(g=>g.map(nf).sort()),cls=((t.allow||{})[k]||[]).map(g=>g.map(nf)),fb=((t.forbid||{})[k]||[]).map(g=>g.map(nf)),forb=fb.some(f=>st.some(g=>f.filter(x=>g.includes(x)).length>1)),inv=!st.every(g=>cls.some(c=>sub(g,c)));return{forb,bad:inv,ok:!forb&&!inv&&req.every(r=>st.some(g=>sub(r,g)))}}
function verdict(){let S=[],A=[],R=[];for(let[id,n]of Object.entries(lv)){if(!n)continue;if(id.length===2)S.push([id,n]);else isR(id)?R.push(id):A.push([id,n])}
let rs=kind('s',nS,groups(S)),ra=kind('a',nA,groups(A)),e=t.exp,ex=(e.r||[]).map(nA),rr=e.r?(R.length>0&&R.every(x=>ex.includes(x))&&(!e.rAll||ex.every(x=>R.includes(x)))):R.length===0;
let bad=[];if(!rs.ok)bad.push('отрезки');if(!ra.ok)bad.push('углы');if(!rr)bad.push('прямой угол');
return{any:S.length+A.length+R.length>0,ok:!bad.length,bad,forb:rs.forb||ra.forb,inv:rs.bad||ra.bad}}
function show(n){cur=n;t=T[n];P=F[t.fig].p;lv={};$('msg').textContent='';$('sec').textContent=t.sec;$('task').textContent=t.text;
$('help').textContent='Нажми на отрезок или внутрь угла около вершины, чтобы поставить отметку. Повторное нажатие меняет или убирает её. Верные лишние отметки ошибкой не считаются, а вывод, который нужно доказать, отмечать нельзя. '+(t.help2||'');
$('prev').disabled=!n;$('next').disabled=n===T.length-1;[...$('nav').children].forEach((b,j)=>b.setAttribute('aria-pressed',j===n));upd();draw()}
function upd(){$('progress').textContent=`Задание ${cur+1} из ${T.length}. Выполнено: ${done.size}`;[...$('nav').children].forEach((b,j)=>b.className=done.has(j)?'done':'')}
T.forEach((_,j)=>{let b=document.createElement('button');b.textContent=j+1;b.setAttribute('aria-label','Задание '+(j+1));b.onclick=()=>show(j);$('nav').append(b)});
$('clear').onclick=()=>show(cur);$('prev').onclick=()=>show(cur-1);$('next').onclick=()=>show(cur+1);
$('check').onclick=()=>{let v=verdict();if(!v.any){$('msg').textContent='Сначала поставь отметки на чертеже.';return}
if(v.forb){$('msg').textContent=t.forbMsg||'Это уже вывод из равенства треугольников: его нужно доказать, поэтому отмечать пока нельзя.';return}
if(v.ok){done.add(cur);try{localStorage.setItem('geomProofs2',JSON.stringify([...done]))}catch(x){}$('msg').textContent=t.ok;upd();return}
$('msg').textContent='Пока не совпадает: '+v.bad.join(', ')+'. '+(v.inv?'Одинаковыми отметками обозначают только равные элементы. ':'')+t.hint};
show(0);
</script></html>
